<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>STX Downloader</title>
  <style>
    :root { color-scheme: dark; }
    body { width: 416px; margin: 0; padding: 16px; background: #0c0d0f; color: #cfe9f5; font: 13px/1.5 "Segoe UI", system-ui, sans-serif; }
    h1 { margin: 0 0 12px; font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: #b8bcc2; }
    ul { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow-y: auto; }
    li { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 8px 12px; margin-bottom: 8px; border: 1px solid rgba(255, 255, 255, .1); border-radius: 4px; background: #05141c; overflow-wrap: anywhere; }
    li.drm { color: #ffb86b; }
    .actions { display: flex; flex: none; flex-direction: column; gap: 4px; }
    button { min-height: 32px; padding: 0 12px; border: 1px solid rgba(255, 255, 255, .16); border-radius: 4px; background: #1f2226; color: #f2f4f6; font: inherit; font-weight: 600; cursor: pointer; transition: background-color 150ms ease-out; }
    button:hover:not(:disabled) { background: #0f5f86; }
    button:focus-visible { outline: 2px solid #5cc8f5; outline-offset: 2px; }
    button:disabled { color: #8d9299; cursor: default; }
    #all { width: 100%; margin-top: 4px; }
    p { margin: 8px 0 0; color: #b8bcc2; }
    #drm { color: #ffb86b; }
    #status { min-height: 20px; }
  </style>
</head>
<body>
  <h1>Media on this tab</h1>
  <ul id="list"></ul>
  <p id="empty" hidden>Nothing found yet. Start the video, then open this again.</p>
  <p id="drm" hidden>This page uses DRM, so its streams can't be saved.</p>
  <button id="all" hidden>Save all</button>
  <p id="status" role="status"></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
