name: build

on:
  push:
  pull_request:

# The build reads the repository and nothing else: no token here can write to it (review 2026-11-07).
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      # Each action is pinned to the commit its release tag named on 2026-11-07, so a moved tag can't change what runs.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      # The VLC engine and SoundFont the player ships (tools/vlc/engine.json), downloaded once and reused.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .engine
          key: engine-${{ hashFiles('tools/vlc/engine.json', 'tools/vlc/Get-Engine.ps1') }}
      # The FFmpeg tests (bit-perfect decoding, Phase 5; shrink copies, Phase 7) run the build STX itself downloads
      # (src/Stx.Tools/FfmpegSource.cs), checked against its publisher's sha256, so they prove that build has the encoders.
      - name: Install FFmpeg (the build STX downloads)
        shell: pwsh
        run: |
          $base = 'https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/latest'
          $zip = 'ffmpeg-n9.0-latest-win64-gpl-9.0.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Invoke-WebRequest "$base/$zip" -OutFile (Join-Path $env:RUNNER_TEMP $zip)
          # GitHub serves the checksum list as binary, so it's saved and read as lines rather than taken from .Content.
          Invoke-WebRequest "$base/checksums.sha256" -OutFile (Join-Path $env:RUNNER_TEMP 'ffmpeg.sha256')
          $want = (Get-Content (Join-Path $env:RUNNER_TEMP 'ffmpeg.sha256') | Where-Object { $_ -match [regex]::Escape($zip) } | Select-Object -First 1) -split '\s+' | Select-Object -First 1
          $got = (Get-FileHash (Join-Path $env:RUNNER_TEMP $zip) -Algorithm SHA256).Hash
          if (-not $want -or $got -ne $want) { throw "FFmpeg's sha256 is $got; its publisher says $want" }
          Expand-Archive (Join-Path $env:RUNNER_TEMP $zip) -DestinationPath $dir
          (Get-ChildItem $dir -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName | Add-Content $env:GITHUB_PATH
      - name: Build
        run: dotnet build src/Stx.App -c Release -p:Platform=x64 --nologo
      # The screenshot tests compare against pixels from one machine's GPU and fonts, so they run locally.
      # Playback tests marked Device need a real sound device, which the runner doesn't have, and the Corpus gate
      # needs the corpus made by tools/corpus/Make-Corpus.ps1; both run locally. Network tests play a live radio station.
      - name: Test
        shell: pwsh
        run: |
          foreach ($project in 'Look', 'Art', 'Core', 'Data', 'Tools', 'Audio', 'Bridge', 'App', 'Playback') {
            dotnet test --project "tests/Stx.$project.Tests" -c Release -p:Platform=x64 --filter-not-trait "Category=Device" --filter-not-trait "Category=Corpus" --filter-not-trait "Category=Network"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Test extension
        run: node --test "extension/test/*.test.js"

  # The projects that aren't Windows-only (Look, Art, Core, Data) are tested on Linux too, so their rules can't lean
  # on Windows by accident: a path's separators, a drive letter, a file system that ignores case.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - name: Test
        shell: bash
        run: |
          for project in Look Art Core Data; do
            dotnet test --project "tests/Stx.$project.Tests" -c Release --filter-not-trait "Category=Device" --filter-not-trait "Category=Corpus" --filter-not-trait "Category=Network"
          done
