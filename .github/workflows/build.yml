name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The VLC engine and SoundFont the player ships (tools/vlc/engine.json), downloaded once and reused.
      - uses: actions/cache@v4
        with:
          path: .engine
          key: engine-${{ hashFiles('tools/vlc/engine.json', 'tools/vlc/Get-Engine.ps1') }}
      # The bit-perfect decode tests (Phase 5) run the real FFmpeg: random samples in, the same samples out.
      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Build
        run: dotnet build src/Stx.App -c Release -p:Platform=x64 --nologo
      # The screenshot tests compare against pixels from one machine's GPU and fonts, so they run locally.
      # Playback tests marked Device need a real sound device, which the runner doesn't have, and the Corpus gate
      # needs the corpus made by tools/corpus/Make-Corpus.ps1; both run locally.
      - name: Test
        shell: pwsh
        run: |
          foreach ($project in 'Look', 'Art', 'Core', 'Data', 'Tools', 'Audio', 'Bridge', 'App', 'Playback') {
            dotnet test "tests/Stx.$project.Tests" -c Release -p:Platform=x64 --nologo --filter "Category!=Device&Category!=Corpus"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Test extension
        run: node --test "extension/test/*.test.js"
